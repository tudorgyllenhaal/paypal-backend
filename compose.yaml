name: paypal-server-local
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: paypal
      MYSQL_USER: paypal
      MYSQL_PASSWORD: paypal_local
      MYSQL_ROOT_PASSWORD: paypal_root_local
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", 'MYSQL_PWD="$$MYSQL_PASSWORD" mysql --protocol=TCP -h 127.0.0.1 -u "$$MYSQL_USER" "$$MYSQL_DATABASE" -e "SELECT 1" >/dev/null']
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
volumes:
  mysql-data:
