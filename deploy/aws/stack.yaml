AWSTemplateFormatVersion: '2010-09-09'
Description: Hertz HTTP server on ECS Fargate
Parameters:
  ImageUri:
    Type: String
    Description: ECR image URI built for linux/amd64
  VpcId:
    Type: AWS::EC2::VPC::Id
  SubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: Public subnets in the selected VPC with an internet gateway route
  AllowedCidr:
    Type: String
    Default: 0.0.0.0/0
  DatabaseHost:
    Type: String
    Description: Existing MySQL endpoint reachable from the ECS subnets
  DatabasePort:
    Type: Number
    Default: 3306
    MinValue: 1
    MaxValue: 65535
  DatabaseName:
    Type: String
    Default: paypal
  DatabaseUser:
    Type: String
  DatabasePassword:
    Type: String
    NoEcho: true
    MinLength: 1
    Description: Existing database user password; stored in Secrets Manager for ECS
  DatabaseTLS:
    Type: String
    Default: 'true'
    AllowedValues: ['true', 'false']
  DatabaseSecurityGroupId:
    Type: String
    Default: ''
    Description: Optional existing database security group to allow access from ECS
Conditions:
  UseDatabaseTLS: !Equals [!Ref DatabaseTLS, 'true']
  HasDatabaseSecurityGroup: !Not [!Equals [!Ref DatabaseSecurityGroupId, '']]
Resources:
  DatabaseSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Description: MySQL password for the server
      SecretString: !Ref DatabasePassword
  Cluster:
    Type: AWS::ECS::Cluster
  Logs:
    Type: AWS::Logs::LogGroup
    Properties:
      RetentionInDays: 14
  ExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub arn:${AWS::Partition}:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
      Policies:
        - PolicyName: ReadDatabasePassword
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Ref DatabaseSecret
  TaskRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
  SecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: HTTP access to the server
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 8080
          ToPort: 8080
          CidrIp: !Ref AllowedCidr
  DatabaseIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Condition: HasDatabaseSecurityGroup
    Properties:
      GroupId: !Ref DatabaseSecurityGroupId
      IpProtocol: tcp
      FromPort: !Ref DatabasePort
      ToPort: !Ref DatabasePort
      SourceSecurityGroupId: !Ref SecurityGroup
  Task:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Cpu: '256'
      Memory: '512'
      NetworkMode: awsvpc
      RequiresCompatibilities: [FARGATE]
      RuntimePlatform:
        CpuArchitecture: X86_64
        OperatingSystemFamily: LINUX
      ExecutionRoleArn: !GetAtt ExecutionRole.Arn
      TaskRoleArn: !GetAtt TaskRole.Arn
      ContainerDefinitions:
        - Name: server
          Image: !Ref ImageUri
          Essential: true
          Environment:
            - Name: MYSQL_HOST
              Value: !Ref DatabaseHost
            - Name: MYSQL_PORT
              Value: !Sub '${DatabasePort}'
            - Name: MYSQL_DATABASE
              Value: !Ref DatabaseName
            - Name: MYSQL_USER
              Value: !Ref DatabaseUser
            - Name: MYSQL_TLS
              Value: !Ref DatabaseTLS
            - Name: MYSQL_TLS_CA_FILE
              Value: !If [UseDatabaseTLS, '/etc/ssl/certs/aws-rds-bundle.pem', '']
          Secrets:
            - Name: MYSQL_PASSWORD
              ValueFrom: !Ref DatabaseSecret
          PortMappings:
            - ContainerPort: 8080
          StopTimeout: 30
          HealthCheck:
            Command: [CMD-SHELL, 'wget -q -O /dev/null http://127.0.0.1:8080/healthz || exit 1']
            Interval: 30
            Timeout: 5
            Retries: 3
            StartPeriod: 10
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref Logs
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: server
  Service:
    Type: AWS::ECS::Service
    Properties:
      Cluster: !Ref Cluster
      TaskDefinition: !Ref Task
      LaunchType: FARGATE
      DesiredCount: 1
      DeploymentConfiguration:
        DeploymentCircuitBreaker:
          Enable: true
          Rollback: true
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          Subnets: !Ref SubnetIds
          SecurityGroups: [!Ref SecurityGroup]
Outputs:
  ServerSecurityGroupId:
    Value: !Ref SecurityGroup
  ClusterName:
    Value: !Ref Cluster
  ServiceName:
    Value: !GetAtt Service.Name
  LogGroup:
    Value: !Ref Logs
